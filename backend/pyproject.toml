[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-eval-console"
version = "0.1.0"
description = "Reproducible model evaluations and evidence-based regression gates"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.39,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "numpy>=2.2,<3", "scipy>=1.15,<2", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1", "huggingface-hub>=0.30,<1",
  "transformers>=4.50,<5", "torch>=2.6,<2.10", "datasets>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "hypothesis>=6.130,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "testcontainers[postgres]>=4.10,<5"]

[project.scripts]
mec = "app.cli.main:main"
mec-worker = "app.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "slow: statistical coverage simulation", "model: downloads and runs a real model"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.inference.*", "app.services.*", "app.api.*", "app.db.*", "app.main", "app.cli.*"]
disallow_any_generics = false
disallow_untyped_defs = false
warn_return_any = false
