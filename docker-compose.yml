name: model-eval-console
x-backend: &backend
  image: model-eval-console-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-env
    MEC_DATABASE_URL: postgresql+psycopg://mec:mec@db:5432/mec
    MEC_TORCH_THREADS: "2"
    MEC_CODE_VERSION: ${MEC_CODE_VERSION:-development}
    HF_HOME: /home/mec/.cache/huggingface
  volumes:
    - hf-cache:/home/mec/.cache/huggingface
  init: true
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mec
      POSTGRES_PASSWORD: mec
      POSTGRES_DB: mec
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mec -d mec"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    <<: *backend
    command: ["mec-worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 2m
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: { condition: service_healthy }
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-demo-only
    volumes: ["./ops/grafana:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
volumes:
  pg-data:
  hf-cache:
